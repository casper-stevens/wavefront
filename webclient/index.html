<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Wavefront</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #14171c;
    --panel-2: #1a1e24;
    --border: #262b33;
    --text: #e8eaed;
    --text-dim: #8a919e;
    --accent: #5b8cff;
    --good: #3ecf6a;
    --warn: #e0a83e;
    --bad: #e05a4e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
    padding: 24px 16px 48px;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .pill {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-dim);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .pill.connecting { color: var(--warn); border-color: #4a3d20; background: #201a0e; }
  .pill.synced { color: var(--good); border-color: #1e3d28; background: #0e1f16; }
  .pill.dropped { color: var(--bad); border-color: #3d2320; background: #1f120f; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }

  #joinScreen { text-align: center; padding: 40px 20px; }
  #joinScreen p.sub { color: var(--text-dim); font-size: 13px; margin: 6px 0 20px; }

  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  input[type=text] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }

  button.big {
    width: 100%;
    background: var(--accent);
    color: #0b0d10;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  button.big:active { transform: translateY(1px); }
  button.big:disabled { opacity: 0.5; cursor: default; }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--text-dim); }
  .row .v { font-weight: 600; font-variant-numeric: tabular-nums; }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 10px;
  }

  #muteBtn {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  #muteBtn.muted { background: #1f120f; border-color: #3d2320; color: var(--bad); }

  #hiddenWarning {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #201a0e;
    color: var(--warn);
    border-top: 1px solid #4a3d20;
    padding: 10px 16px;
    text-align: center;
    font-size: 13px;
    z-index: 10;
  }
  #hiddenWarning.show { display: block; }

  #app { display: none; width: 100%; }
  #app.show { display: block; }

  footer {
    color: var(--text-dim);
    font-size: 11px;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Wavefront</h1>
    <span id="statusPill" class="pill connecting">idle</span>
  </header>

  <div id="joinScreen" class="card">
    <p class="sub">Turn this browser tab into a synced Wavefront speaker.</p>
    <label for="nameInput">Speaker name</label>
    <input type="text" id="nameInput" maxlength="64">
    <button class="big" id="joinBtn">Join as speaker</button>
  </div>

  <div id="app">
    <div class="card">
      <p class="section-title">Assignment</p>
      <div class="row"><span class="k">Role</span><span class="v" id="roleVal">-</span></div>
      <div class="row"><span class="k">Pan</span><span class="v" id="panVal">-</span></div>
      <div class="row"><span class="k">Gain</span><span class="v" id="gainVal">-</span></div>
      <div class="row"><span class="k">Crossover</span><span class="v" id="crossoverVal">-</span></div>
      <div class="row"><span class="k">Buffer</span><span class="v" id="bufferVal">-</span></div>
    </div>

    <div class="card">
      <p class="section-title">Sync stats</p>
      <div class="row"><span class="k">Clock offset</span><span class="v" id="offsetVal">-</span></div>
      <div class="row"><span class="k">Round trip</span><span class="v" id="rttVal">-</span></div>
      <div class="row"><span class="k">Scheduled chunks</span><span class="v" id="scheduledVal">0</span></div>
      <div class="row"><span class="k">Dropped (late)</span><span class="v" id="droppedVal">0</span></div>
      <div class="row"><span class="k">Interruptions</span><span class="v" id="glitchVal">0</span></div>
    </div>

    <button id="muteBtn">Mute</button>
  </div>

  <footer>ws://<span id="hostLabel"></span>/ws</footer>
</div>

<div id="hiddenWarning">Keep this tab focused for best sync</div>

<script src="player.js"></script>
</body>
</html>
