[package]
name = "wavefront"
version = "0.1.0"
edition = "2021"
description = "Wavefront - LAN synced multi-speaker system"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
local-ip-address = "0.6"
tower-http = { version = "0.5", features = ["fs"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
hostname = "0.4"
