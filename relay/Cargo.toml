[package]
name = "wavefront-relay"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wavefront-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tower-http = { version = "0.5", features = ["fs"] }
anyhow = "1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
